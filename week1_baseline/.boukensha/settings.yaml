tasks:
  player:
    provider: mammouth
    model: claude-haiku-4-5
    max_iterations: 100
    prompt_override:
      system: false
mud:
  host: localhost
  port: 4000
  username: dummy
  password: helloworld

# Additional MCP servers, connected on top of the MUD. Each entry is a server:
# the key names it (and namespaces its tools on a name collision), and whatever
# it advertises over MCP becomes agent tools — no new code. The MUD stays wired
# separately above, since it has an in-process fallback and a reachability probe.
